[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexaplay-agent"
version = "0.1.0"
description = "AI-Native development agent for NexaPlay multi-tenant configuration management"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.39.0",
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "tiktoken>=0.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "respx>=0.22",
]

[project.scripts]
nexaplay-agent = "src.agent.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "module"
testpaths = ["src/tests"]

[tool.hatch.build.targets.wheel]
packages = ["src"]
